<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setting up your pod</title>
<style>
  :root{ --bg:#14151a; --panel:#1e2027; --line:#2c2f39; --text:#e8e9ee; --muted:#9a9eab; --accent:#ff9a3c; --ok:#4cc38a; --bad:#ef6a6a; color-scheme:dark; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,"Segoe UI",sans-serif}
  main{max-width:640px;margin:0 auto;padding:40px 20px}
  h1{font-size:26px;margin:0 0 6px}
  .sub{color:var(--muted);margin:0 0 28px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
  .row{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:s 0.9s linear infinite;flex:none}
  .spin.done{animation:none;border-color:var(--ok);background:var(--ok)}
  .spin.bad{animation:none;border-color:var(--bad);background:var(--bad)}
  @keyframes s{to{transform:rotate(360deg)}}
  .msg{font-size:19px;font-weight:600}
  .bar{height:14px;background:var(--line);border-radius:99px;overflow:hidden}
  .fill{height:100%;width:0;background:var(--accent);transition:width .8s ease}
  .fill.done{background:var(--ok)}
  .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-top:8px}
  .btn{display:none;margin-top:20px;padding:12px 22px;border-radius:10px;border:0;background:var(--accent);color:#1a1208;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
  .btn.show{display:inline-block}
  .warn{display:none;margin-top:18px;padding:12px 14px;border:1px solid var(--bad);border-radius:10px;font-size:14px}
  .warn.show{display:block}
  details{margin-top:22px}
  summary{cursor:pointer;color:var(--muted)}
  ul{list-style:none;padding:0;margin:12px 0 0}
  li{display:flex;gap:10px;align-items:center;padding:4px 0;font-size:14px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
  .dot.done{background:var(--ok)} .dot.downloading{background:var(--accent)}
  li span.n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  li span.s{color:var(--muted);font-size:12px}
</style>
</head>
<body>
<main>
  <h1>Setting up your pod</h1>
  <p class="sub">This page updates by itself. You can leave it open.</p>
  <div class="card">
    <div class="row"><div class="spin" id="spin"></div><div class="msg" id="msg">Starting up…</div></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="meta"><span id="pct">0%</span><span id="time"></span></div>
    <a class="btn" id="open" href="#" target="_blank" rel="noopener">Open ComfyUI</a>
    <div class="warn" id="warn"></div>
    <details>
      <summary>Show every file</summary>
      <ul id="files"></ul>
    </details>
  </div>
</main>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  // the progress page is on port 3000; ComfyUI is the same address on port 8188
  $('open').href = location.protocol + '//' + location.host.replace('-3000.', '-8188.') + '/';

  function fmt(s){ var m = Math.floor(s/60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r + ' elapsed'; }

  function draw(s){
    var ready = s.state === 'ready' || s.state === 'problems';
    var failed = s.state === 'failed';
    $('msg').textContent = ready ? (s.state === 'ready' ? 'All set. ComfyUI is ready.' : 'Finished, but a few things need attention.') : s.message;
    $('spin').className = 'spin' + (ready ? ' done' : failed ? ' bad' : '');
    $('fill').style.width = s.percent + '%';
    $('fill').className = 'fill' + (ready ? ' done' : '');
    $('pct').textContent = s.percent + '%';
    $('time').textContent = fmt(s.elapsed);
    var openBtn = $('open');
    if (ready && s.comfy_up) openBtn.className = 'btn show'; else openBtn.className = 'btn';
    var warn = $('warn');
    if ((s.failures && s.failures.length) || failed) {
      warn.className = 'warn show';
      warn.textContent = (failed ? s.message + '. ' : 'These did not install: ') + (s.failures || []).join('; ');
    } else warn.className = 'warn';
    var ul = $('files'); ul.textContent = '';
    (s.files || []).forEach(function(f){
      var li = document.createElement('li');
      var d = document.createElement('span'); d.className = 'dot ' + f.state;
      var n = document.createElement('span'); n.className = 'n'; n.textContent = f.name;
      var t = document.createElement('span'); t.className = 's';
      t.textContent = f.state === 'done' ? 'done' : f.state === 'downloading' ? (f.got_mb + ' of ~' + f.mb + ' MB') : 'waiting';
      li.appendChild(d); li.appendChild(n); li.appendChild(t); ul.appendChild(li);
    });
    (s.nodes || []).forEach(function(nd){
      var li = document.createElement('li');
      var d = document.createElement('span'); d.className = 'dot ' + (nd.done ? 'done' : 'downloading');
      var n = document.createElement('span'); n.className = 'n'; n.textContent = 'node pack: ' + nd.name;
      var t = document.createElement('span'); t.className = 's'; t.textContent = nd.done ? 'installed' : 'installing';
      li.appendChild(d); li.appendChild(n); li.appendChild(t); ul.appendChild(li);
    });
  }

  function tick(){
    fetch('/status', {cache: 'no-store'}).then(function(r){ return r.json(); }).then(draw, function(){
      $('msg').textContent = 'Waiting for the pod…';
    });
  }
  tick(); setInterval(tick, 1500);
})();
</script>
</body>
</html>
